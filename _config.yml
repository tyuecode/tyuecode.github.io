# 基本配置
title: "TY的博客"
description: "分享编程和生活"
logo: /assets/img/MiLogo.jpg
show_downloads: false
baseurl: ""  # 部署在根域名，留空
url: "https://tangyue.me"  # 实际自定义域名（tyuecode.github.io 会跳转至此）

# 作者信息
author:
  name: TY
  email: 1252107428@qq.com
  avatar: "/assets/img/MiLogo.jpg"  # 作者头像路径（修正拼写 MiLogal->MiLogo）
  github: "tyuecode"

# 主题设置
theme: jekyll-theme-minimal

# 构建设置
markdown: kramdown  # 使用的Markdown解析器
highlighter: rouge  # 代码高亮引擎
timezone: "Asia/Shanghai" # 时区设置
lang: zh-CN #默认为中文

source: "."              # 源文件目录（通常是项目根目录）
layouts_dir: "_layouts"  # 布局模板目录
includes_dir: "_includes"  # 包含文件目录（header、footer等）
assets_dir: "assets"  # 静态资源目录

# 默认设置
defaults:
  - scope:
      path: ""         # 空表示所有路径
      type: "posts"    # 仅对posts类型的文件生效
    values:
      layout: "post"   # 默认使用post布局
      author: TY

  - scope:
      path: "pages"    # 对pages目录下的文件生效
    values:
      layout: "page"   # 默认使用page布局
# 插件
plugins:
  - jekyll-feed       # 生成RSS/Atom订阅源
  - jekyll-sitemap    # 生成sitemap.xml
  - jekyll-seo-tag    # SEO优化标签
